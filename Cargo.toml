[package]
name = "dexvm"
version = "0.1.0"
edition = "2021"
description = "Minimal JVM (DEX) interpreter for keiyoushi/Tachiyomi extensions"

[features]
# host shim classes for the Android framework (android.*)
android = []
# host shim classes for OkHttp (okhttp3.*)
okhttp = []
# host shim classes for the mihon extension API (eu.kanade.tachiyomi.source.*)
keiyoushi = ["android", "okhttp", "dep:dom_query"]

[lib]
name = "dexvm"

[[bin]]
name = "dexcli"
path = "src/bin/dexcli.rs"

[[test]]
name = "keiyoushi_e2e"
required-features = ["keiyoushi"]

[[test]]
name = "api_smoke"
required-features = ["keiyoushi"]

[[test]]
name = "live_keiyoushi"
required-features = ["keiyoushi"]

[[test]]
name = "keiyoushi_flow"
required-features = ["keiyoushi"]

[dependencies]
fancy-regex = "0.19.0"
zip = "8.6.0"
dom_query = { version = "0.28.0", optional = true }

[dev-dependencies]
ureq = "3.4.0"
