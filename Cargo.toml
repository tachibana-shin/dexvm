[package]
name = "dexvm"
version = "0.1.0"
edition = "2021"
description = "Minimal DEX (Dalvik bytecode) VM runtime in Rust, embeddable as a library and tuned for mihon/Tachiyomi (keiyoushi) manga extensions"
keywords = ["dex", "dalvik", "android", "vm", "mihon"]
categories = ["embedded", "virtualization", "parser-implementations"]
readme = "README.md"
license = "Apache-2.0"

[features]
default = ["java", "kotlin", "injekt", "jsoup", "android", "okhttp", "tachiyomi"]
# Java standard library host shims (java.*)
java = []
# Kotlin stdlib host shims (kotlin.*)
kotlin = []
# koan / injekt DI shims (injekt.*)
injekt = []
# org.jsoup host shims (parsed via dom_query)
jsoup = ["dep:dom_query"]
# host shim classes for the Android framework (android.*)
android = []
# host shim classes for OkHttp (okhttp3.*)
okhttp = []
# host shim classes for the mihon extension API (eu.kanade.tachiyomi.source.*)
tachiyomi = []
# compat alias: full mihon/keiyoushi source pipeline (the `keiyoushi` bridge)
keiyoushi = ["tachiyomi", "kotlin", "injekt", "jsoup", "android", "okhttp"]

[lib]
name = "dexvm"

[[bin]]
name = "dexcli"
path = "src/bin/dexcli.rs"

[[test]]
name = "keiyoushi_e2e"
required-features = ["keiyoushi"]

[[test]]
name = "api_smoke"
required-features = ["keiyoushi"]

[[test]]
name = "live_keiyoushi"
required-features = ["keiyoushi"]

[[test]]
name = "keiyoushi_flow"
required-features = ["keiyoushi"]

[dependencies]
fancy-regex = "0.19.0"
zip = "8.6.0"
dom_query = { version = "0.28.0", optional = true }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
base64 = "0.22"
aes-gcm = "0.10"

[dev-dependencies]
aes-gcm = "0.10"
ureq = "3.4.0"
